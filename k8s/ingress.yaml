apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mce
  namespace: mce
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1g
spec:
  ingressClassName: nginx
  rules:
    - host: mce.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mce
                port:
                  name: http